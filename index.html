
<!DOCTYPE html>
<html>
<head>
    <title>College Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #243b64;
        }

        .container {
            background-color: white;
            width: 80%;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            color: #243b64;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #243b64;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #4169a1;
        }

        .student {
            background-color: #f1f5fb;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .hidden {
            display: none;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        hr {
            margin: 25px 0;
        }
    </style>
</head>

<body>

    <h1>College Student Management System</h1>

    <div class="container">

        <!-- Student Registration -->
        <h2>Student Registration</h2>

        <input type="text" id="name"
            placeholder="Enter Student Name">

        <input type="text" id="roll"
            placeholder="Enter Roll Number">

        <input type="text" id="department"
            placeholder="Enter Department">

        <input type="text" id="semester"
            placeholder="Enter Semester">

        <button onclick="addStudent()">
            Add Student
        </button>

        <hr>

        <!-- Student List -->
        <h2>Student List</h2>

        <div id="studentList">
            <p>No students added yet.</p>
        </div>

        <hr>

        <!-- Examination Result -->
        <h2>Examination Result</h2>

        <input type="text" id="resultRoll"
            placeholder="Enter Student Roll Number">

        <input type="number" id="marks"
            placeholder="Enter Examination Marks (0-100)"
            min="0" max="100">

        <button onclick="showResult()">
            Calculate Result
        </button>

        <div id="result"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
