
<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
</head>

<body>

<div id="app">

    <h2>Student Details Form</h2>

    <!-- Two-way data binding for username -->
    <label>User Name:</label>
    <input type="text" v-model="username">
    <br><br>

    <!-- Two-way data binding for age -->
    <label>Age:</label>
    <input type="number" v-model="age">
    <br><br>

    <!-- Normal input for department -->
    <label>Department:</label>
    <input type="text" id="department">
    <br><br>

    <!-- Normal input for semester -->
    <label>Semester:</label>
    <input type="text" id="semester">
    <br><br>

    <button @click="showDetails">Submit</button>

    <h3>Student Information</h3>

    <p>User Name: {{ username }}</p>
    <p>Age: {{ age }}</p>
    <p>Department: <span id="showDept"></span></p>
    <p>Semester: <span id="showSem"></span></p>

</div>

<script>

const app = Vue.createApp({

    data() {
        return {
            username: '',
            age: ''
        };
    },

    methods: {
        showDetails() {
            document.getElementById("showDept").innerText =
                document.getElementById("department").value;

            document.getElementById("showSem").innerText =
                document.getElementById("semester").value;
        }
    }

});

app.mount('#app');

</script>

</body>
</html>
